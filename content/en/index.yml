linkage:
  documentLabel: Draft Youth Act
  sectionNumber: Article 12
  sectionTitle: Access to housing
  textBefore: "Public administrations shall promote specific measures to support young people leaving the family home, including "
  textHighlight: a minimum quota of social housing reserved for people under the age of 35
  textAfter: ", under the terms to be set by regulation."
  connector: Linked to
  degreeLabel: Strong match
  proposal:
    author: Spanish Youth Council
    authorType: Civil society
    text: Reserve a minimum share of newly built public housing for young people, with long-term tenancies and rents indexed to their income.
    groupLabel: 4 organisations submitted an equivalent proposal
  explanationLabel: Why it is linked
  explanation: The article adopts the reserved quota of social housing for people under 35 that the proposal called for. It does not adopt the request to index rents to income.
  caption: Illustrative example of the output the system produces.

