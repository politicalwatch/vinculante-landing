linkage:
  documentLabel: Draft Orbital Settlements Governance Act
  sectionNumber: Article 7
  sectionTitle: Electoral participation of residents
  textBefore: "Persons permanently resident on Spanish-owned orbital stations "
  textHighlight: "may exercise their right to vote in elections by electronic means"
  textAfter: ". The technical conditions shall be set by regulation."
  connector: Linked to
  degreeLabel: Moderate match
  proposal:
    author: Hespérides Station Residents' Association
    authorType: Civil society
    text: Guarantee the vote of those living in orbit through a verifiable electronic system, with an extended counting period to make up for the communication delay with Earth.
    groupLabel: 2 organisations submitted an equivalent proposal
  explanationLabel: Why it is linked
  explanation: The article recognises the right to vote from orbit and the electronic channel the proposal called for. It does not include the verifiability of the system or the extended counting period.
  caption: This law does not exist (yet). This is how Vinculante would show its link to public participation.

