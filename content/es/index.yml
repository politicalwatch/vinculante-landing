features:
  headline: Qué aporta
  # ALT título: "La trazabilidad que hoy no existe"
  title: Un texto legal que explica de dónde viene
  description: Hoy nadie puede saber qué aportaciones de un proceso participativo han acabado en la norma. Vinculante.ai hace explícita esa relación, disposición a disposición.
  items:
    - icon: i-lucide-link
      title: Vinculación artículo a artículo
      description: Cada disposición muestra las aportaciones que la respaldan, y cada aportación muestra dónde ha quedado recogida. La navegación funciona en los dos sentidos.
    - icon: i-lucide-gauge
      title: Grado de incorporación
      description: No todo se recoge igual. El sistema distingue entre lo incorporado de forma sustancial y lo recogido solo en parte, para no inflar el resultado.
    - icon: i-lucide-quote
      title: Explicación y fragmento exacto
      description: Cada vinculación se acompaña de una justificación razonada y del tramo concreto del texto legal al que se refiere. Nada queda en una puntuación opaca.
    - icon: i-lucide-languages
      title: Lenguaje jurídico y lenguaje claro
      description: El sistema genera una versión en lenguaje accesible de cada disposición. Es lo que permite comparar una propuesta ciudadana con un texto normativo.
    - icon: i-lucide-search-x
      title: También lo que no se recogió
      description: Las aportaciones sin reflejo en la norma se muestran igualmente, agrupadas por temática. La rendición de cuentas incluye lo que quedó fuera.
    - icon: i-lucide-user-check
      title: Revisión humana antes de publicar
      description: Ninguna vinculación se publica sin que el equipo responsable la confirme, corrija o descarte. La herramienta asiste; no decide.

steps:
  headline: Cómo funciona
  title: Cuatro pasos, de los documentos a la publicación
  description: El proceso se ejecuta una vez por norma y se puede repetir cuando el texto cambia durante la tramitación.
  items:
    - icon: i-lucide-upload
      title: 1 · Se cargan los documentos
      description: Las aportaciones del proceso participativo (PDF, hoja de cálculo o tabla resumen) y el texto normativo resultante.
    - icon: i-lucide-list-tree
      title: 2 · Se estructura la norma
      description: El texto se divide respetando su jerarquía legal —títulos, capítulos, artículos, disposiciones— y de cada pieza se genera una versión en lenguaje claro.
    - icon: i-lucide-sparkles
      title: 3 · Se detectan y verifican las vinculaciones
      description: Búsqueda semántica para localizar las disposiciones candidatas y verificación con IA que devuelve grado, explicación y fragmento señalado.
    - icon: i-lucide-shield-check
      title: 4 · Se revisa y se publica
      description: El equipo responsable valida los resultados y publica la lectura enriquecida de la norma, abierta a cualquier persona.
  # PENDIENTE: grabar la demo (20-30 s, sin voz) y dejarla en public/videos/.
  # Añadir `src: /videos/demo.mp4` y `poster: /videos/demo-poster.jpg` para sustituir el marcador.
  video:
    label: Demostración de Vinculante.ai, de la carga de documentos a la lectura enriquecida de la norma.
    placeholder: Demo en preparación
    play: Reproducir la demo
    pause: Pausar la demo

audiences:
  headline: Para quién
  title: Cuatro maneras de usar el mismo texto
  description: La misma lectura enriquecida responde preguntas distintas según quién la consulte.
  items:
    - icon: i-lucide-landmark
      title: Administraciones
      description: Cierran el círculo del proceso participativo con una devolución documentada, sin dedicar semanas a cruzar aportaciones con articulado a mano.
    - icon: i-lucide-scale
      title: Legisladores
      description: Llegan a la tramitación sabiendo qué respaldo ciudadano, académico y técnico sostiene cada disposición que van a votar.
    - icon: i-lucide-users
      title: Ciudadanía y entidades
      description: Quien participó puede comprobar qué ha pasado con su aportación, sin leer doscientas páginas de texto jurídico.
    - icon: i-lucide-newspaper
      title: Medios e investigación
      description: Una fuente consultable sobre el origen de cada medida, con las aportaciones y sus autores identificados.

