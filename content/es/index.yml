steps:
  headline: Cómo funciona
  title: Cuatro pasos, de los documentos a la publicación
  description: El proceso se ejecuta una vez por norma y se puede repetir cada vez que el texto cambie durante la tramitación.
  items:
    - icon: i-lucide-upload
      title: 1 · Se cargan los documentos
      description: Las aportaciones del proceso participativo (PDF, hoja de cálculo o tabla resumen) y el texto normativo resultante.
    - icon: i-lucide-list-tree
      title: 2 · Se estructura la norma
      description: El texto se divide automáticamente respetando su jerarquía legal —títulos, capítulos, artículos, disposiciones— y de cada pieza se genera una versión en lenguaje claro.
    - icon: i-lucide-sparkles
      title: 3 · Se detectan y analizan las vinculaciones
      description: Búsqueda semántica para localizar las disposiciones candidatas y análisis con IA que devuelve el grado de vinculación, una justificación y el fragmento identificado.
    - icon: i-lucide-shield-check
      title: 4 · Se verifica y se publica
      description: El equipo responsable del proceso valida los resultados y publica la lectura enriquecida de la norma, abierta a cualquier persona interesada.
  video:
    src: /videos/demo.mp4
    poster: /videos/demo-poster.jpg
    label: Demostración de Vinculante.ai, de la carga de documentos a la lectura enriquecida de la norma.
    placeholder: Demo en preparación
    play: Reproducir la demo
    pause: Pausar la demo

# Maqueta ilustrativa del producto que se muestra bajo los pasos y el vídeo.
linkage:
  documentLabel: Proyecto de Ley de Juventud
  sectionNumber: Artículo 12
  sectionTitle: Acceso a la vivienda
  textBefore: "Las administraciones públicas promoverán medidas específicas que faciliten la emancipación, entre ellas "
  textHighlight: la reserva de un porcentaje mínimo de vivienda protegida destinada a personas menores de 35 años
  textAfter: ", en los términos que reglamentariamente se establezcan."
  connector: Vinculado con
  degreeLabel: Grado alto
  proposal:
    author: Consejo de la Juventud
    authorType: Sociedad civil
    text: Reservar un porcentaje mínimo de la vivienda pública de nueva promoción para personas jóvenes, con contratos de alquiler de larga duración y renta referenciada a sus ingresos.
    groupLabel: 4 entidades presentaron una propuesta equivalente
  explanationLabel: Por qué se vincula
