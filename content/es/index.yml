seo:
  title: Vinculante.ai — De la participación al texto de la ley
  description: Herramienta de IA que identifica qué aportaciones ciudadanas están recogidas en cada artículo de una norma, con qué grado y por qué. Desarrollada por Political Watch.
title: "De la participación\nal texto de la ley"
description: Vinculante.ai analiza las aportaciones de un proceso participativo y señala en qué disposición de la norma ha quedado recogida cada una, con qué grado y con qué justificación. Trazabilidad verificable entre lo que se propuso y lo que se legisló.

