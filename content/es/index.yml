  caption: Ejemplo ilustrativo del resultado que produce el sistema.

features:
  headline: Qué aporta
  # ALT título: "La trazabilidad que hoy no existe"
  title: Un texto oficial que explica de dónde viene
  description: Hoy es muy costoso saber qué aportaciones de un proceso participativo han acabado plasmándose en la norma. Vinculante.ai hace explícita y comprensible esa relación, artículo a artículo.
  items:
    - icon: i-lucide-link
      title: Vinculación artículo a artículo
      description: Cada disposición muestra las aportaciones que la respaldan, y cada aportación muestra dónde ha quedado recogida. La navegación funciona en los dos sentidos.
    - icon: i-lucide-gauge
      title: Grado de incorporación
      description: No todo se recoge igual. El sistema distingue entre lo incorporado de forma sustancial y lo recogido solo en parte, para que el análisis sea lo más realista posible.
    - icon: i-lucide-quote
      title: Explicación y fragmento exacto
      description: Cada vinculación se acompaña de una justificación razonada y del bloque concreto del texto al que se refiere. Nada queda en una puntuación opaca.
    - icon: i-lucide-languages
      title: Lenguaje jurídico y lenguaje claro
      description: El sistema genera una versión en lenguaje accesible de cada disposición. Es lo que permite que ambos mundos puedan convivir.
    - icon: i-lucide-summary
      title: Resumen ejecutivo
      description: Se ofrece una versión simplificada del análisis para aquellas personas que tengan poco tiempo, con estadísticas y titulares clave.
    - icon: i-lucide-user-check
      title: Validación humana antes de publicar
      description: Ninguna vinculación se publica sin que el equipo responsable del proceso la confirme, corrija o descarte. La herramienta asiste, no decide.

audiences:
  headline: Para quién
  title: Cuatro maneras de consumir el mismo texto
  description: La misma lectura enriquecida responde preguntas distintas según quién la consulte.
  items:
    - icon: i-lucide-landmark
      title: Administraciones
      description: Cierran el círculo del proceso participativo con una devolución documentada, sin dedicar semanas a cruzar aportaciones con articulos a mano.
    - icon: i-lucide-scale
      title: Legisladores
      description: Llegan a la tramitación sabiendo qué respaldo ciudadano, académico y técnico sostiene cada disposición que van a votar.
    - icon: i-lucide-users
      title: Ciudadanía y entidades
      description: Cada participante puede comprobar qué ha pasado con sus aportaciones, sin leer doscientas páginas de texto jurídico.
    - icon: i-lucide-newspaper
      title: Medios e investigación
      description: Una fuente consultable sobre el origen de cada medida, con las aportaciones y sus autores identificados.

