linkage:
  documentLabel: Proyecto de Ley de Juventud
  sectionNumber: Artículo 12
  sectionTitle: Acceso a la vivienda
  textBefore: "Las administraciones públicas promoverán medidas específicas que faciliten la emancipación, entre ellas "
  textHighlight: la reserva de un porcentaje mínimo de vivienda protegida destinada a personas menores de 35 años
  textAfter: ", en los términos que reglamentariamente se establezcan."
  connector: Vinculado con
  degreeLabel: Grado alto
  proposal:
    author: Consejo de la Juventud
    authorType: Sociedad civil
    text: Reservar un porcentaje mínimo de la vivienda pública de nueva promoción para personas jóvenes, con contratos de alquiler de larga duración y renta referenciada a sus ingresos.
    groupLabel: 4 entidades presentaron una propuesta equivalente
  explanationLabel: Por qué se vincula
  explanation: El artículo incorpora la reserva de vivienda protegida para menores de 35 años que pedía la propuesta. No recoge, en cambio, la referencia de la renta a los ingresos.
